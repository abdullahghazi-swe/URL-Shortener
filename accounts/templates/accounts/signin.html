{% extends 'base.html' %}
{% load static %}

{% block title %} Log in {% endblock %}

{% block css %}
    <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
{% endblock %}

{% block content %}

<div class="auth-block">
    <form method="POST">
        <h1 class="page-title">Log in to your account</h1>
        {% csrf_token %}
        <div class="form-item">
            <label>Username</label>
            {{ form.username }}
        </div>
        <div class="form-item">
            <label>Password</label>
            {{ form.password }}
        </div>
        
        <button type="submit" class="submit-btn">Sign In</button>

        <p>Don't have an account? <a href="{% url 'signup' %}" class="redirect-btn">Sign up</a> </p>
    </form>
</div>




{% endblock %}
