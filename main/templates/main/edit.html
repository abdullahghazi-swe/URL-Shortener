{% extends 'base.html' %}
{% load static %}

{% block title %} Link - Edit {% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'main/css/style.css' %}">
{% endblock %}

{% block content %}
<div>
    <h2>Edit Link</h2>
    <form method="POST">
        {% csrf_token %}

        <div class="url-block">
            <div class="title">
                    <label for="title" class="title-label">Title:</label>
                    {{ form.title }}
            </div>
            <div class="top-row">
                <label for="input_url" class="title-label">Destination URL:</label>
                {{ form.input_url }}
            </div>
            <div class="info-row">
                <div class="alias">
                    <label for="shorten" class="title-label">Custom alias:</label>
                    <span class="domain">{{ base_url }}/go/</span>
                    {{ form.shorten }}
                </div>
                <div class="status-box">
                    <label for="status" class="title-label">Status:</label>
                    {{ form.status }}
                </div>
            </div>
            
            <button type="submit" class="submit saveChanges">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
